[project]
name = "astrafable-factory"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["tools/factory"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
